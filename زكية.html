<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./fontawesome-free-6.7.1-web/css/all.min.css"/>
    <title>عرض فيديو بالطول</title>
    <style>
        /* ضبط كامل الشاشة */
        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body, html {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }
        video {
            max-height: 100%;
            max-width: 100%;
            width: auto;
            height: auto;
        }
        a {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-decoration: none;
        }
        .i {
            font-size: 32px;
            background-color: white;
        }

        /* ميديا كويري للموبايلات الصغيرة */
        @media (max-width: 600px) {
            .i {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html"><img src="close.png" class="i"></a>
    <video controls autoplay playsinline>
        <source src="زكية.mp4" type="video/mp4">
        متصفحك لا يدعم مشغل الفيديو.
    </video>
</body>
</html>
